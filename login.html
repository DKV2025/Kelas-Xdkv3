<!DOCTYPE html>
<html lang="id">
  <link rel="icon" type="image/webp" href="images/favicon.webp">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - XI DKV </title>

  <link rel="stylesheet" href="auth.css">
</head>

<body>

  <main class="auth-page">

    <section class="auth-card">

      <h1>
        Selamat datang di<br>
        website XI DKV 2025
      </h1>

      <form class="auth-form" id="loginForm">


<form class="auth-form" id="loginForm">

  <!-- KOLOM USERNAME -->
  <div class="auth-input-group">
    <span class="auth-icon">👤</span>
    <div class="floating-wrapper">
      <input type="text" id="loginUsername" placeholder=" " required>
      <label for="loginUsername">Username</label>
    </div>
  </div>

 
  <div class="auth-input-group">
    <span class="auth-icon">✉️</span>
    <div class="floating-wrapper">
      <input type="email" id="loginEmail" placeholder=" " autocomplete="email" required>
      <label for="loginEmail">Email</label>
    </div>
  </div>

 
  <div class="auth-input-group">
    <span class="auth-icon">🔒</span>
    <div class="floating-wrapper">
      <input type="password" id="loginPassword" placeholder=" " required>
      <label for="loginPassword">Password</label>
    </div>
    
    <button type="button" class="toggle-password" onclick="togglePassword('loginPassword', this)">
      ⌣
    </button>
  </div>

  <button type="submit" class="auth-btn">
    Login
  </button>

</form>

</form>

      <p class="auth-switch">
        Belum punya akun?<br>
        <a class="auth-switch2" href="register.html">register sekarang</a>
      </p>
      <p class="auth-switch2">
        <a class="auth-switch2" href="forgot.html">Lupa password?</a>
      </p>
    

    </section>

  </main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>
<script src="auth.js"></script>
</body>
</html>
