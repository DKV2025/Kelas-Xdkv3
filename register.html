<!DOCTYPE html>
<html lang="id">
  <link rel="icon" type="image/png" href="images/favicon.webp">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - XI DKV</title>

  <link rel="stylesheet" href="auth.css">
</head>

<body>

  <main class="auth-page">

    <section class="auth-card">

      <h1>
        Buat akun<br>
        website XI DKV 2025
      </h1>

      <form class="auth-form" id="registerForm">

  <!-- KOLOM USERNAME -->
  <div class="auth-input-group">
    <span class="auth-icon">👤</span>
    <div class="floating-wrapper">
      <input type="text" id="registerUsername" placeholder=" " required>
      <label for="registerUsername">Username</label>
    </div>
  </div>

  
  <div class="auth-input-group">
    <span class="auth-icon">✉️</span>
    <div class="floating-wrapper">
      <input type="email" id="registerEmail" placeholder=" " autocomplete="email" required>
      <label for="registerEmail">Email</label>
    </div>
  </div>

  <!-- KOLOM PASSWORD + MATA -->
  <div class="auth-input-group">
    <span class="auth-icon">🔒</span>
    <div class="floating-wrapper">
      <input type="password" id="registerPassword" placeholder=" " required>
      <label for="registerPassword">Password</label>
    </div>
    <button type="button" class="toggle-password" onclick="togglePassword('registerPassword', this)">
      ⌣
    </button>
  </div>


  <div class="auth-input-group">
    <span class="auth-icon">🔒</span>
    <div class="floating-wrapper">
      <input type="password" id="registerConfirmPassword" placeholder=" " required>
      <label for="registerConfirmPassword">Verify Your Password</label>
    </div>
    <button type="button" class="toggle-password" onclick="togglePassword('registerConfirmPassword', this)">
      ⌣
    </button>
  </div>

  <button type="submit" class="auth-btn">
    Buat
  </button>

</form>

    </section>

  </main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>
<script src="auth.js"></script>
</body>
</html>
